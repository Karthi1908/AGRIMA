steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agrima-explainer:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agrima-explainer:latest'
      - '.'

  # 2. Push Container Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/agrima-explainer:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (Fully Managed, Ephemeral RAM)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agrima-explainer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/agrima-explainer:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'

images:
  - 'gcr.io/$PROJECT_ID/agrima-explainer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agrima-explainer:latest'

options:
  logging: CLOUD_LOGGING_ONLY
